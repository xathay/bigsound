[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/xathay/bigsound"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Strip shipped artifacts to reduce package size; diagnostic builds can
# override this profile when symbolized stack traces are needed.
strip = "symbols"
